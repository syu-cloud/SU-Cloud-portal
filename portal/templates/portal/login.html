{% extends "portal/base.html" %}
{% block title %}로그인 — SU Cloud Portal{% endblock %}
{% block content %}
<div style="max-width:360px;margin:80px auto 0">
    <div class="card">
        <h1 style="margin-bottom:20px">로그인</h1>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <p class="error-text" style="margin-bottom:14px">아이디 또는 비밀번호가 올바르지 않습니다.</p>
            {% endif %}
            <div class="field-block" style="margin-bottom:14px">
                <label for="id_username">아이디</label>
                <input type="text" name="username" id="id_username" required
                    style="width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;">
            </div>
            <div class="field-block" style="margin-bottom:18px">
                <label for="id_password">비밀번호</label>
                <input type="password" name="password" id="id_password" required
                    style="width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;">
            </div>
            <input type="hidden" name="next" value="{{ next|default:'/portal/' }}">
            <button type="submit" class="primary" style="width:100%">로그인</button>
        </form>
    </div>
</div>
{% endblock %}
